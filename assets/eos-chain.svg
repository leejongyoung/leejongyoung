<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" width="420" height="340" fill="none">

  <!-- Card 1 -->
  <rect x="50" y="20" width="320" height="60" rx="14" ry="14" fill="#161b22" stroke="#4a6741" stroke-width="2"/>
  <text x="210" y="56" text-anchor="middle" fill="#c9d1d9" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold">1. 기술지원 및 패치 종료</text>

  <!-- Arrow 1 -->
  <line x1="210" y1="80" x2="210" y2="120" stroke="#5c7a52" stroke-width="2"/>
  <polygon points="200,115 210,130 220,115" fill="#5c7a52"/>
  <rect x="155" y="92" width="110" height="20" rx="10" ry="10" fill="#161b22" stroke="#5c7a52" stroke-width="1"/>
  <text x="210" y="106" text-anchor="middle" fill="#7ca872" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11">보안 공백</text>

  <!-- Card 2 -->
  <rect x="50" y="140" width="320" height="60" rx="14" ry="14" fill="#161b22" stroke="#5c7a52" stroke-width="2"/>
  <text x="210" y="176" text-anchor="middle" fill="#c9d1d9" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold">2. 취약점 발생 및 위협 증가</text>

  <!-- Arrow 2 -->
  <line x1="210" y1="200" x2="210" y2="240" stroke="#5c7a52" stroke-width="2"/>
  <polygon points="200,235 210,250 220,235" fill="#5c7a52"/>
  <rect x="155" y="212" width="110" height="20" rx="10" ry="10" fill="#161b22" stroke="#5c7a52" stroke-width="1"/>
  <text x="210" y="226" text-anchor="middle" fill="#7ca872" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11">침해 확산</text>

  <!-- Card 3 -->
  <rect x="50" y="260" width="320" height="60" rx="14" ry="14" fill="#161b22" stroke="#6b8f5e" stroke-width="2"/>
  <text x="210" y="296" text-anchor="middle" fill="#c9d1d9" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold">3. 자산 손실 및 체계 파괴</text>

</svg>
