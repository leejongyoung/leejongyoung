<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 480" width="420" height="480" fill="none">

  <!-- Card 1 -->
  <rect x="30" y="20" width="360" height="100" rx="16" ry="16" fill="#161b22" stroke="#4a6741" stroke-width="2"/>
  <text x="210" y="52" text-anchor="middle" fill="#7ca872" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="bold">선제적 격리</text>
  <text x="210" y="78" text-anchor="middle" fill="#c9d1d9" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13">자산 식별 즉시 네트워크 격리(Air-Gap) 수행</text>
  <text x="210" y="98" text-anchor="middle" fill="#c9d1d9" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13">및 외부 접점 차단</text>

  <!-- Arrow 1 -->
  <line x1="210" y1="120" x2="210" y2="165" stroke="#5c7a52" stroke-width="2"/>
  <polygon points="200,160 210,175 220,160" fill="#5c7a52"/>
  <rect x="160" y="135" width="100" height="20" rx="10" ry="10" fill="#161b22" stroke="#5c7a52" stroke-width="1"/>
  <text x="210" y="149" text-anchor="middle" fill="#7ca872" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11">격리 완료</text>

  <!-- Card 2 -->
  <rect x="30" y="180" width="360" height="100" rx="16" ry="16" fill="#161b22" stroke="#5c7a52" stroke-width="2"/>
  <text x="210" y="212" text-anchor="middle" fill="#7ca872" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="bold">보안 완화</text>
  <text x="210" y="238" text-anchor="middle" fill="#c9d1d9" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13">IPS/WAF 정책 강화를 통한</text>
  <text x="210" y="258" text-anchor="middle" fill="#c9d1d9" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13">가상 패치(Virtual Patching) 적용</text>

  <!-- Arrow 2 -->
  <line x1="210" y1="280" x2="210" y2="325" stroke="#5c7a52" stroke-width="2"/>
  <polygon points="200,320 210,335 220,320" fill="#5c7a52"/>
  <rect x="160" y="295" width="100" height="20" rx="10" ry="10" fill="#161b22" stroke="#5c7a52" stroke-width="1"/>
  <text x="210" y="309" text-anchor="middle" fill="#7ca872" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11">완화 적용</text>

  <!-- Card 3 -->
  <rect x="30" y="340" width="360" height="100" rx="16" ry="16" fill="#161b22" stroke="#6b8f5e" stroke-width="2"/>
  <text x="210" y="372" text-anchor="middle" fill="#7ca872" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="bold">현대화 전환</text>
  <text x="210" y="398" text-anchor="middle" fill="#c9d1d9" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13">안정성이 검증된 LTS 버전으로 강제 전환</text>
  <text x="210" y="418" text-anchor="middle" fill="#c9d1d9" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13">및 무결성 검증 프로세스 이행</text>

</svg>
